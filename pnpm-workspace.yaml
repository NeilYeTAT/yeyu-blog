minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@types/node"
trustPolicy: off
blockExoticSubdeps: true
overrides:
  "@types/node": 26.0.1
  kysely: 0.28.17
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  prisma: true
  sharp: true
